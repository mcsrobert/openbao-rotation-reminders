---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release
on:
  release:
    types:
      - published

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}
  CHART_REGISTRY: ghcr.io/${{ github.repository_owner }}/charts
  CHART_NAME: openbao-rotation-reminders

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yaml

  publish:
    needs: ["ci"]
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      chart-digest: ${{ steps.push-chart.outputs.digest || steps.published.outputs.chart-digest }}
      digest: ${{ steps.build.outputs.digest || steps.published.outputs.digest }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "${TAG} is not a release tag"
            exit 1
          fi
          echo "version=${TAG#v}" >> "${GITHUB_OUTPUT}"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Install tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.11.14
          install_args: helm yq
          cache: false
      - name: Check the chart version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for field in version appVersion; do
            actual=$(yq ".${field}" "charts/${CHART_NAME}/Chart.yaml")
            if [[ "${actual}" != "${VERSION}" ]]; then
              echo "Chart.yaml has ${field} ${actual}, expected ${VERSION}"
              exit 1
            fi
          done
      - name: Log in to GHCR with Helm
        env:
          GH_TOKEN: ${{ github.token }}
        run: helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin <<< "${GH_TOKEN}"
      - name: Find what this release already published
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          directory=$(mktemp -d)
          trap 'rm -rf "${directory}"' EXIT

          lookup_tag() {
            local repo="${1,,}"
            local tag="$2"
            local token code err_code digest
            local auth="${directory}/auth"
            local bearer="${directory}/bearer"
            local headers="${directory}/headers"
            local body="${directory}/body"

            printf 'user = "%s:%s"\n' "${GITHUB_ACTOR}" "${GH_TOKEN}" > "${auth}"
            token=$(curl --fail --silent --show-error \
              --config "${auth}" \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${repo}:pull" \
              | yq --input-format json '.token') || return 1
            if [[ -z "${token}" || "${token}" == "null" ]]; then
              echo "Could not authenticate to ghcr.io for ${repo}" >&2
              return 1
            fi

            printf 'header = "Authorization: Bearer %s"\n' "${token}" > "${bearer}"
            code=$(curl --silent --show-error \
              --config "${bearer}" \
              --dump-header "${headers}" \
              --output "${body}" \
              --write-out '%{http_code}' \
              --header "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/${repo}/manifests/${tag}") || return 1

            if [[ "${code}" == "200" ]]; then
              digest=$(tr -d '\r' < "${headers}" | awk 'tolower($1) == "docker-content-digest:" { print $2; exit }')
              if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "Could not read the digest of ghcr.io/${repo}:${tag}" >&2
                return 1
              fi
              printf '%s\n' "${digest}"
              return 0
            fi

            if [[ "${code}" == "404" ]]; then
              err_code=$(yq --input-format json '.errors[0].code // ""' "${body}" 2>/dev/null || true)
              if [[ "${err_code}" == "MANIFEST_UNKNOWN" || "${err_code}" == "NAME_UNKNOWN" ]]; then
                return 0
              fi
            fi

            echo "Could not tell whether ghcr.io/${repo}:${tag} exists (HTTP ${code})" >&2
            cat "${body}" >&2
            return 1
          }

          verify_release_attestation() {
            local subject="$1"
            gh attestation verify "oci://${subject}" \
              --repo "${REPOSITORY}" \
              --signer-workflow "${REPOSITORY}/.github/workflows/release.yaml" \
              --source-ref "refs/tags/${TAG}" \
              --source-digest "${GITHUB_SHA}" \
              --deny-self-hosted-runners
          }

          digest=$(lookup_tag "${IMAGE#ghcr.io/}" "${VERSION}")
          if [[ -n "${digest}" ]]; then
            if ! verify_release_attestation "${IMAGE}@${digest}"; then
              echo "${IMAGE}:${VERSION}@${digest} already exists without a matching release attestation. If an earlier run failed before attesting it, delete that package version in GHCR and re-run."
              exit 1
            fi
            echo "Reusing ${IMAGE}:${VERSION}@${digest}"
            echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          fi

          chart_digest=$(lookup_tag "${CHART_REGISTRY#ghcr.io/}/${CHART_NAME}" "${VERSION}")
          if [[ -n "${chart_digest}" ]]; then
            if [[ -z "${digest}" ]]; then
              echo "${CHART_REGISTRY}/${CHART_NAME}:${VERSION}@${chart_digest} already exists without a published image"
              exit 1
            fi
            if ! verify_release_attestation "${CHART_REGISTRY}/${CHART_NAME}@${chart_digest}"; then
              echo "${CHART_REGISTRY}/${CHART_NAME}:${VERSION}@${chart_digest} already exists without a matching release attestation. If an earlier run failed before attesting it, delete that package version in GHCR and re-run."
              exit 1
            fi
            mkdir -p "${directory}/chart"
            if ! output=$(helm pull "oci://${CHART_REGISTRY}/${CHART_NAME}" --version "${VERSION}" --destination "${directory}/chart" 2>&1); then
              echo "${output}"
              echo "Could not pull existing ${CHART_REGISTRY}/${CHART_NAME}:${VERSION}@${chart_digest}"
              exit 1
            fi
            pulled_digest=$(sed -n 's/^Digest: //p' <<< "${output}")
            if [[ "${pulled_digest}" != "${chart_digest}" ]]; then
              echo "Expected ${CHART_REGISTRY}/${CHART_NAME}:${VERSION} digest ${chart_digest}, got ${pulled_digest}"
              exit 1
            fi
            pinned=$(helm show values "${directory}/chart/${CHART_NAME}-${VERSION}.tgz" | yq '.image.digest')
            if [[ "${pinned}" != "${digest}" ]]; then
              echo "${CHART_REGISTRY}/${CHART_NAME}:${VERSION} already exists and pins ${pinned}"
              exit 1
            fi
            echo "Reusing ${CHART_REGISTRY}/${CHART_NAME}:${VERSION}@${chart_digest}"
            echo "chart-digest=${chart_digest}" >> "${GITHUB_OUTPUT}"
          fi
      - name: Build and push
        id: build
        if: steps.published.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          annotations: |
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.description=Daily ntfy digest of OpenBao KV v2 secrets due for rotation
            index:org.opencontainers.image.licenses=Apache-2.0
            index:org.opencontainers.image.version=${{ steps.version.outputs.version }}
            index:org.opencontainers.image.revision=${{ github.sha }}
      - name: Attest build provenance
        if: steps.build.outputs.digest != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Package the chart
        if: steps.published.outputs.chart-digest == ''
        env:
          DIGEST: ${{ steps.build.outputs.digest || steps.published.outputs.digest }}
        run: |
          yq --inplace '.image.digest = strenv(DIGEST)' "charts/${CHART_NAME}/values.yaml"
          helm package "charts/${CHART_NAME}" --destination "${RUNNER_TEMP}/chart"
      - name: Push the chart
        id: push-chart
        if: steps.published.outputs.chart-digest == ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          output=$(helm push "${RUNNER_TEMP}/chart/${CHART_NAME}-${VERSION}.tgz" "oci://${CHART_REGISTRY}" 2>&1)
          echo "${output}"
          digest=$(sed -n 's/^Digest: //p' <<< "${output}")
          if [[ "${digest}" != sha256:* ]]; then
            echo "Could not read the chart digest"
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      - name: Attest the chart's build provenance
        if: steps.push-chart.outputs.digest != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.CHART_REGISTRY }}/${{ env.CHART_NAME }}
          subject-digest: ${{ steps.push-chart.outputs.digest }}
          push-to-registry: true

  verify:
    needs: ["publish"]
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      attestations: read
      contents: read
    steps:
      - name: Pull anonymously and check the version
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          docker logout ghcr.io || true
          if ! docker pull "${IMAGE}@${DIGEST}"; then
            echo "Could not pull ${IMAGE} anonymously. After the first release, make the package public and re-run this job."
            exit 1
          fi
          actual=$(docker run --rm "${IMAGE}@${DIGEST}" --version)
          if [[ "${actual}" != "${VERSION}" ]]; then
            echo "Expected ${VERSION}, got ${actual}"
            exit 1
          fi
      - name: Verify the attestation
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: gh attestation verify "oci://${IMAGE}@${DIGEST}" --repo "${REPOSITORY}"

  verify-chart:
    needs: ["publish"]
    runs-on: ubuntu-24.04
    permissions:
      attestations: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.11.14
          install_args: helm yq
          cache: false
      - name: Pull anonymously and check the image pin
        env:
          CHART_DIGEST: ${{ needs.publish.outputs.chart-digest }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          directory=$(mktemp -d)
          if ! output=$(helm pull "oci://${CHART_REGISTRY}/${CHART_NAME}" --version "${VERSION}" --destination "${directory}" 2>&1); then
            echo "${output}"
            echo "Could not pull the chart anonymously. After the first release, make the package public and re-run this job."
            exit 1
          fi
          echo "${output}"
          if [[ "$(sed -n 's/^Digest: //p' <<< "${output}")" != "${CHART_DIGEST}" ]]; then
            echo "Expected chart digest ${CHART_DIGEST}"
            exit 1
          fi
          actual=$(helm show values "${directory}/${CHART_NAME}-${VERSION}.tgz" | yq '.image.digest')
          if [[ "${actual}" != "${DIGEST}" ]]; then
            echo "Expected image digest ${DIGEST}, got ${actual}"
            exit 1
          fi
      - name: Verify the attestation
        env:
          CHART_DIGEST: ${{ needs.publish.outputs.chart-digest }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: gh attestation verify "oci://${CHART_REGISTRY}/${CHART_NAME}@${CHART_DIGEST}" --repo "${REPOSITORY}"

  release:
    needs: ["publish", "verify", "verify-chart"]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Add the published artifacts to the GitHub release
        env:
          CHART_DIGEST: ${{ needs.publish.outputs.chart-digest }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          changelog=$(gh release view "${TAG}" --repo "${REPOSITORY}" --json body --jq .body)
          header="Image: \`${IMAGE}:${VERSION}@${DIGEST}\`

          Chart: \`oci://${CHART_REGISTRY}/${CHART_NAME}:${VERSION}@${CHART_DIGEST}\`"
          if [[ "${changelog}" == "${header}"* ]]; then
            exit 0
          fi
          notes="${header}

          ${changelog}"
          gh release edit "${TAG}" --repo "${REPOSITORY}" --notes "${notes}"
